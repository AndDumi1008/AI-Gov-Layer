# Egress allowlist for the AI gateway. Anything not listed here is refused and logged.
# EU only, no exception (PD-43): the list is empty. An EU-region provider host is added here only together
# with its approved registry entry (docs/07 §10.5).
http_port 3128
http_access deny all
access_log daemon:/var/log/squid/access.log squid
cache deny all
visible_hostname egress-proxy
