# Egress allowlist for the AI gateway. Anything not listed here is refused and logged.
http_port 3128
acl allowed_dst dstdomain api.anthropic.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_dst
http_access allow allowed_dst
http_access deny all
access_log daemon:/var/log/squid/access.log squid
cache deny all
visible_hostname egress-proxy
