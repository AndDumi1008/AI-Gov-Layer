# Overlay for SERVER (Windows + WSL2 + NVIDIA):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile model up -d
# SERVER has two GPUs (GTX 1070 = index 0, GTX 1050 = index 1); pin the 1070.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
