# Gate 2 — Merge candidate. Builds ONCE from the merge commit, migrates against a
# copy of the current schema, deploys a preview of main+PR, runs smoke, e2e and
# previous-release contract tests.
#
# PD-10: a RELEASE signature is produced only in merge_group runs (the merge
# queue's final merge commit, which becomes main's commit on merge). PR runs get
# an unprivileged "preview" attestation that the release and the cluster never
# accept. The release verifies the certificate's workflow ref and trigger.
#
# PD-11: default token read-only; per-job permissions; the preview deploy is its
# own job bound to the `preview` environment, whose credentials reach only the
# preview namespace. Runners for this workflow should be ephemeral.
name: merge-candidate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build · sbom · attest
    runs-on: ${{ vars.AGL_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign + provenance
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # ratchet:docker/setup-buildx-action@v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # ratchet:docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # ratchet:docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false # we attach our own below
          sbom: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # ratchet:anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # ratchet:sigstore/cosign-installer@v3

      # ---- PR run: preview attestation only (never accepted by release/admission)
      - name: Preview attestation (pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          printf '{"kind":"preview","pr":"%s","sha":"%s"}' "${{ github.event.pull_request.number }}" "${{ github.sha }}" > preview.json
          cosign attest --yes --predicate preview.json --type https://agl.example/preview/v1 "${IMAGE}@${{ steps.build.outputs.digest }}"

      # ---- merge_group run: release signature + SBOM + provenance
      - name: Release signature (merge_group only)
        if: github.event_name == 'merge_group'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: SBOM attestation (merge_group only)
        if: github.event_name == 'merge_group'
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: SLSA provenance (merge_group only)
        if: github.event_name == 'merge_group'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # ratchet:actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  migrations:
    name: migrations against current schema (masked snapshot)
    runs-on: ${{ vars.AGL_RUNNER || 'ubuntu-latest' }}
    services:
      db:
        image: index.docker.io/library/postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # ratchet:postgres:16
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - name: Load CURRENT schema snapshot (from main, masked data)
        run: make db-load-snapshot DB_URL=postgres://postgres:ci@localhost:5432/postgres
      - name: Apply this PR's migrations forward
        run: make db-migrate DB_URL=postgres://postgres:ci@localhost:5432/postgres
      - name: Expand/contract check — old version must still run on new schema
        run: make db-compat-check DB_URL=postgres://postgres:ci@localhost:5432/postgres PREVIOUS_REF=origin/main

  preview:
    name: preview environment (main + PR)
    runs-on: ${{ vars.AGL_RUNNER || 'ubuntu-latest' }}
    needs: [build, migrations]
    if: github.event_name == 'pull_request'
    # PD-11: credentials for this job come from the `preview` environment's secrets and
    # are scoped (cloud role / namespace) to the preview cluster only. The cloud OIDC
    # trust policy must require environment:preview in the token claims.
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.preview.internal.example
    permissions:
      contents: read
      id-token: write # cloud OIDC, scoped by environment claim
      pull-requests: write # for the status comment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - name: Deploy preview from the digest with masked data
        run: make preview-up NAME=pr-${{ github.event.pull_request.number }} DIGEST=${{ needs.build.outputs.digest }} DATASET=masked-latest
      - name: Smoke + e2e
        run: make e2e BASE_URL=https://pr-${{ github.event.pull_request.number }}.preview.internal.example
      - name: Previous release contract tests against the new server (N-1 compatibility)
        run: make contract-tests PREVIOUS_RELEASE="$(git describe --tags --abbrev=0 origin/main)" BASE_URL=https://pr-${{ github.event.pull_request.number }}.preview.internal.example
      - name: Report on the PR
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "**Merge candidate ready**
          Preview: https://pr-${{ github.event.pull_request.number }}.preview.internal.example
          Image: \`${IMAGE}@${{ needs.build.outputs.digest }}\` (preview attestation; release signature is produced in the merge queue)
          Migrations: applied forward on current schema, expand/contract OK
          Smoke/e2e: passed · N-1 contract tests: passed"

  evidence:
    name: audit evidence
    runs-on: ${{ vars.AGL_RUNNER || 'ubuntu-latest' }}
    needs: [build, migrations]
    if: always()
    permissions:
      contents: read
      id-token: write # PD-13: the audit API authenticates this workflow by its OIDC token
    steps:
      - name: Publish merge-candidate event to the AGL audit chain (OIDC-authenticated)
        env: {AGL_AUDIT_URL: "${{ vars.AGL_AUDIT_URL }}"}
        run: |
          [ -z "$AGL_AUDIT_URL" ] && { echo "AGL_AUDIT_URL not set; skipping"; exit 0; }
          IDTOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=agl-audit" | jq -r .value)
          curl -fsS -X POST "$AGL_AUDIT_URL/events" -H "Authorization: Bearer $IDTOKEN" -H 'content-type: application/json' -d @- <<JSON
          {"type":"merge_candidate","trigger":"${{ github.event_name }}","repo":"${{ github.repository }}","pr":"${{ github.event.pull_request.number }}","sha":"${{ github.sha }}","digest":"${{ needs.build.outputs.digest }}","build":"${{ needs.build.result }}","migrations":"${{ needs.migrations.result }}","run":"${{ github.run_id }}"}
          JSON
