# Gate 2 (PaaS variant) — for the parcel app: Supabase-format backend and static frontend, both on SERVER.
# Builds the frontend ONCE into a static export, hashes it, and (only in merge_group
# runs) signs it as a blob with cosign. Applies this PR's migrations forward on the PREVIEW
# stack from the current staging schema with the expand/contract check, deploys the
# same artifact to the preview web container on SERVER, runs e2e and N-1 contract tests.
#
# Build once, deploy many: the bundle reads its backend URL at runtime from /config.json,
# which `make web-deploy` writes per environment outside the bundle, so the same artifact
# serves preview, staging and production (PD-44).
#
# PD-10: release signature only on merge_group. PD-11: read-only default token; the preview
# job alone holds environment-scoped credentials. PD-18: runs-on from a repository variable.
name: merge-candidate-paas

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  prebuilt:
    name: prebuilt · hash · sign
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.AGL_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write # keyless cosign for the blob signature (merge_group only)
    outputs:
      digest: ${{ steps.hash.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: npm ci --ignore-scripts
      - name: Build the static export once (no env baked in; runtime config)
        run: make web-build # next build with output 'export' → out/
      - name: Package + migration manifest + hash
        id: hash
        run: |
          tar -C out -cf prebuilt.tar .
          # Migration checksums travel with the artifact; the production job compares them.
          ( cd supabase/migrations && sha256sum -- *.sql ) > migrations.sha256
          D=$(sha256sum prebuilt.tar | cut -d' ' -f1)
          echo "digest=sha256:$D" >> "$GITHUB_OUTPUT"
          echo "$D  prebuilt.tar" > prebuilt.sha256
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # ratchet:sigstore/cosign-installer@v3
      - name: Release signature on the artifact (merge_group only)
        if: github.event_name == 'merge_group'
        run: cosign sign-blob --yes --bundle prebuilt.bundle prebuilt.tar
      - name: Preview marker (pull_request only)
        if: github.event_name == 'pull_request'
        run: printf '{"kind":"preview","pr":"%s","sha":"%s"}' "${{ github.event.pull_request.number }}" "${{ github.sha }}" > preview.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: prebuilt-${{ github.sha }}
          path: |
            prebuilt.tar
            prebuilt.sha256
            migrations.sha256
            prebuilt.bundle
            preview.json
          if-no-files-found: ignore
          retention-days: 30

  migrations:
    name: migrations on preview stack (from current staging schema)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.AGL_RUNNER || 'ubuntu-latest' }}
    needs: [prebuilt]
    environment: preview # PREVIEW_DB_URL lives here; reaches preview-net only
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # ratchet:supabase/setup-cli@v1
        with: {version: "2.x"}
      - name: Reset preview to the current staging schema + masked seed
        run: make preview-db-reset DB_URL="${{ secrets.PREVIEW_DB_URL }}" DATASET=masked-latest
      - name: Apply this PR's migrations forward
        run: supabase db push --db-url "${{ secrets.PREVIEW_DB_URL }}" --include-all
      - name: Expand/contract check — previous frontend must still work on the new schema
        run: make db-compat-check DB_URL="${{ secrets.PREVIEW_DB_URL }}" PREVIOUS_REF=origin/main
      - name: Deploy edge functions to the preview stack
        run: make functions-deploy ENV=preview

  preview:
    name: web preview on SERVER (main + PR)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.AGL_RUNNER || 'ubuntu-latest' }}
    needs: [prebuilt, migrations]
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    environment:
      name: preview # WEB_DEPLOY_KEY opens the preview web root only
      url: https://preview.parcel.shortandsweet.home.ro
    permissions:
      contents: read
      pull-requests: write # status comment only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          name: prebuilt-${{ github.sha }}
      - name: Verify the artifact hash before deploying
        run: sha256sum -c prebuilt.sha256
      - name: Deploy the same artifact to the preview web container (backend = preview-api on the tailnet)
        env: {WEB_DEPLOY_KEY: "${{ secrets.WEB_DEPLOY_KEY }}"}
        run: |
          make web-deploy ENV=preview ARTIFACT=prebuilt.tar DIGEST=${{ needs.prebuilt.outputs.digest }} \
               BACKEND_URL=https://preview-api.shortandsweet.home.ro
      - name: Smoke + e2e (browser on the tailnet reaches the private backend)
        run: make e2e BASE_URL=https://preview.parcel.shortandsweet.home.ro BACKEND_URL=https://preview-api.shortandsweet.home.ro
      - name: Previous release contract tests against the new backend (N-1)
        run: make contract-tests PREVIOUS_RELEASE="$(git describe --tags --abbrev=0 origin/main)" BACKEND_URL=https://preview-api.shortandsweet.home.ro
      - name: Report on the PR
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "**Merge candidate ready (PaaS)**
          Preview: https://preview.parcel.shortandsweet.home.ro → backend preview-api.shortandsweet.home.ro (masked data; one preview at a time, this PR's run)
          Artifact: \`${{ needs.prebuilt.outputs.digest }}\` (preview marker; release signature is produced in the merge queue)
          Migrations: applied forward on current staging schema, expand/contract OK
          Smoke/e2e: passed · N-1 contract tests: passed"

  evidence:
    name: audit evidence
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.AGL_RUNNER || 'ubuntu-latest' }}
    needs: [prebuilt, migrations]
    if: always()
    permissions:
      contents: read
      id-token: write # PD-13
    steps:
      - name: Publish merge-candidate event to the AGL audit chain (OIDC-authenticated)
        env: {AGL_AUDIT_URL: "${{ vars.AGL_AUDIT_URL }}"}
        run: |
          [ -z "$AGL_AUDIT_URL" ] && { echo "AGL_AUDIT_URL not set; skipping"; exit 0; }
          IDTOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=agl-audit" | jq -r .value)
          curl -fsS -X POST "$AGL_AUDIT_URL/events" -H "Authorization: Bearer $IDTOKEN" -H 'content-type: application/json' -d @- <<JSON
          {"type":"merge_candidate","variant":"paas","trigger":"${{ github.event_name }}","repo":"${{ github.repository }}","pr":"${{ github.event.pull_request.number }}","sha":"${{ github.sha }}","digest":"${{ needs.prebuilt.outputs.digest }}","build":"${{ needs.prebuilt.result }}","migrations":"${{ needs.migrations.result }}","run":"${{ github.run_id }}"}
          JSON
