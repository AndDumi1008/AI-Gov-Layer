# Gate 1 for this repository (docs/08 §2, stage 1), on GitHub-hosted runners: nothing here needs SERVER.
# Runs on the merge commit (main + PR) and again in the merge queue. PR jobs hold a read-only token.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  env-vars:
    name: env-vars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - run: bash pipeline/scripts/check-env-vars.sh

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks over full history (allowlist in .gitleaks.toml covers the synthetic DLP test patterns)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --config /repo/.gitleaks.toml

  policy-test:
    name: policy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - run: docker run --rm -v "$PWD/stack/policy:/policy:ro" openpolicyagent/opa:1.4.2-static test /policy -v

  gateway-test:
    name: gateway-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ratchet:actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet -r stack/gateway/requirements.txt
      - run: cd stack/gateway && python -m pytest -q tests

  schema:
    name: schema
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - name: Load migrations and seed
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          for f in stack/schema/001_core.sql stack/schema/002_poc.sql stack/schema/010_seed.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Constraints hold (append-only audit, non-EU approved endpoint, quarantine guard)
        run: |
          set -e
          fail(){ echo "::error::$1"; exit 1; }
          psql -h localhost -U postgres -c "insert into audit_segment(id,started_at) values (gen_random_uuid(),now()); delete from audit_segment;" 2>&1 | grep -q 'append-only' || fail "audit delete was not refused"
          psql -h localhost -U postgres -c "update model_endpoint set status='approved' where alias='code-default';" 2>&1 | grep -q 'violates check constraint' || fail "non-EU approved endpoint was not refused"
          psql -h localhost -U postgres -c "update repository set ai_exposure='allowed' where full_name='shortandsweet/app-x';" 2>&1 | grep -q 'gate not satisfied' || fail "quarantine guard did not fire"
          echo "constraints OK"

  workflows-lint:
    name: workflows-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -no-color .github/workflows/*.yml pipeline/.github/workflows/*.yml

  ai-label:
    name: ai-label
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write          # only this job; it runs no code from the PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Detect AI-Assisted / Co-Authored-By trailer, label, require the checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git log --format=%B "$BASE..$HEAD" | grep -Eiq '^(AI-Assisted|Co-Authored-By):.*(claude|copilot|codex|cursor|gemini)'; then
            gh pr edit "$PR" --add-label ai-assisted
            if gh pr view "$PR" --json body -q .body | grep -q '\- \[ \]'; then
              echo "::error::AI-assisted checklist has unticked items (edit the PR description)"; exit 1
            fi
            echo "ai-assisted: labelled, checklist complete"
          else
            echo "no AI trailer found"
          fi

  ticket:
    name: ticket
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Every change is traceable to a ticket (owner's working rule; docs/11 gap 12)
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s\n%s' "$TITLE" "$BODY" | grep -Eq '(^|[^A-Za-z0-9_/])(#[0-9]+|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+)([^0-9]|$)'; then
            echo "ticket reference found"
          else
            echo "::error::No ticket reference. Add 'Ticket: #<issue>' (or owner/repo#<issue>) to the PR description."; exit 1
          fi
