# Gate 1 for this repository (docs/08 §2, stage 1), on GitHub-hosted runners: nothing here needs SERVER.
# Runs on the merge commit (main + PR) and again in the merge queue. PR jobs hold a read-only token.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # not edited: ai-label and ticket are in pr-meta.yml
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  env-vars:
    name: env-vars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - run: bash pipeline/scripts/check-env-vars.sh

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks over full history (allowlist in .gitleaks.toml covers the synthetic DLP test patterns)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --no-banner --config /repo/.gitleaks.toml

  policy-test:
    name: policy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - run: docker run --rm -v "$PWD/stack/policy:/policy:ro" openpolicyagent/opa:1.4.2-static test /policy -v

  gateway-test:
    name: gateway-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ratchet:actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet -r stack/gateway/requirements.txt
      - run: cd stack/gateway && python -m pytest -q tests

  schema:
    name: schema
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - name: Load migrations and seed
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          for f in stack/schema/001_core.sql stack/schema/002_poc.sql stack/schema/010_seed.sql stack/schema/020_eu_only.sql stack/schema/030_content_store.sql stack/schema/040_client.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"; done
          # the migrations are idempotent: a second pass over a live database changes nothing and fails nowhere
          for f in stack/schema/020_eu_only.sql stack/schema/030_content_store.sql stack/schema/040_client.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Constraints hold (append-only audit, EU only, quarantine guard)
        run: |
          set -e
          fail(){ echo "::error::$1"; exit 1; }
          psql -h localhost -U postgres -c "insert into audit_segment(id,started_at) values (gen_random_uuid(),now()); delete from audit_segment;" 2>&1 | grep -q 'append-only' || fail "audit delete was not refused"
          psql -h localhost -U postgres -c "update model_endpoint set status='approved' where alias='code-default';" 2>&1 | grep -q 'violates check constraint' || fail "non-EU approved endpoint was not refused"
          psql -h localhost -U postgres -c "update model_endpoint set status='evaluating' where alias='code-default';" 2>&1 | grep -q 'violates check constraint' || fail "non-EU evaluating endpoint was not refused"
          [ "$(psql -h localhost -U postgres -tAc "select status from model_endpoint where alias='code-default'")" = revoked ] || fail "the US endpoint is not revoked"
          [ "$(psql -h localhost -U postgres -tAc "select count(*) from exception where type='model_enable' and status='approved'")" = 0 ] || fail "a model_enable exception is still approved"
          grep -qE '^\s*acl\s+allowed_dst\b' stack/proxy/squid.conf && fail "egress allowlist is not empty"
          psql -h localhost -U postgres -c "update repository set ai_exposure='allowed' where full_name='shortandsweet/app-x';" 2>&1 | grep -q 'gate not satisfied' || fail "quarantine guard did not fire"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -qc "insert into content_record (id,event_id,kind,identity_id,team_id,key_id,prompt_cipher,prompt_sha256,expires_at) values ('00000000-0000-0000-0000-00000000c001',gen_random_uuid(),'completion','00000000-0000-0000-0000-000000000101','00000000-0000-0000-0000-000000000021','k','\\x01','sha256:x',now()+interval '30 days');"
          psql -h localhost -U postgres -c "update content_record set prompt_cipher='\\x02' where id='00000000-0000-0000-0000-00000000c001';" 2>&1 | grep -q 'erased, not rewritten' || fail "a stored prompt could be rewritten"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -qc "update content_record set prompt_cipher=null, erased_at=now() where id='00000000-0000-0000-0000-00000000c001';"
          psql -h localhost -U postgres -c "update content_record set prompt_cipher='\\x01' where id='00000000-0000-0000-0000-00000000c001';" 2>&1 | grep -q 'stays erased\|not rewritten' || fail "an erased record could be refilled"
          [ "$(psql -h localhost -U postgres -tAc "select has_table_privilege('agl_gateway','content_record','DELETE')")" = f ] || fail "the gateway may delete content records"
          [ "$(psql -h localhost -U postgres -tAc "select count(*) from identity_role r join identity i on i.id=r.identity_id where i.subject='carla' and r.role='client'")" = 1 ] || fail "the seeded client has no client role"
          echo "constraints OK"

  workflows-lint:
    name: workflows-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -no-color .github/workflows/*.yml pipeline/.github/workflows/*.yml
